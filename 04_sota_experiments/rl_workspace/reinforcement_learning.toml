
run_type = "staged_learning"
device = "cuda:0"
tb_logdir = "/kaggle/working/04_sota_experiments/rl_workspace/tb"
json_out_config = "/kaggle/working/04_sota_experiments/rl_workspace/rl_config.json"

[parameters]
prior_file = "/kaggle/working/04_sota_experiments/rl_workspace/priors/reinvent.v4.prior"
agent_file = "/kaggle/working/04_sota_experiments/rl_workspace/priors/reinvent.v4.prior"
summary_csv_prefix = "/kaggle/working/04_sota_experiments/rl_workspace/boltz2_rl"
batch_size = 128

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001

[[stage]]
chkpt_file = "/kaggle/working/04_sota_experiments/rl_workspace/priors/reinvent.v4.prior"
termination = "simple"
max_score = 1.0
min_steps = 200
max_steps = 200

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.Boltz2Affinity]
[[stage.scoring.component.Boltz2Affinity.endpoint]]
name = "Boltz2_pIC50"
weight = 0.6
params = { mode = ["surrogate"], target_sequence = ["PQITLWQRPLVTIKIGGQLKEALLDTGADDTVLEEMSLPGRWKPKMIGGIGGFIKVRQYDQILIEICGHKAIGTVLVGPTPVNIIGRNLLTQIGCTLNF"], api_key_env = ["NVIDIA_API_KEY"], cache_path = ["/kaggle/working/04_sota_experiments/rl_workspace/boltz2_direct_cache.json"], surrogate_path = ["/kaggle/working/04_sota_experiments/rl_workspace/surrogate_boltz2.joblib"], timeout = [600] }

[[stage.scoring.component]]
[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name = "QED"
weight = 0.2

[[stage.scoring.component]]
[stage.scoring.component.SAComplement]
[[stage.scoring.component.SAComplement.endpoint]]
name = "SA_complement"
weight = 0.2
params = { unused = ["x"] }
